[tool.poetry]
name = "pqrelay"
version = "0.1.0"
description = "Experimental classical and ML-DSA-44 Nostr relay"
authors = ["Tim Bouma"]
package-mode = false

[tool.poetry.dependencies]
python = ">=3.11,<3.14"
aioconsole = "==0.8.2"
aiohappyeyeballs = "==2.6.1"
aiohttp = "==3.13.3"
aiosignal = "==1.4.0"
aiosqlite = "==0.22.1"
annotated-types = "==0.7.0"
async-timeout = "==5.0.1"
attrs = "==25.4.0"
bech32 = "==1.2.0"
cachetools = "==6.2.4"
cffi = "==2.0.0"
cryptography = "==46.0.3"
frozenlist = "==1.8.0"
idna = "==3.11"
stroma-nostr = { git = "https://github.com/trbouma/stroma.git", rev = "51496fa6094a126311e9ea59ea06081cd8fbf9f7", extras = ["pq"] }
monstr = "==0.1.9"
multidict = "==6.7.0"
propcache = "==0.4.1"
pycparser = "==2.23"
pycryptodome = "==3.23.0"
pydantic = "==2.12.5"
pydantic-settings = "==2.12.0"
pydantic_core = "==2.41.5"
python-dotenv = "==1.2.1"
secp256k1 = "==0.14.0"
tomli = "==2.3.0"
typing-inspection = "==0.4.2"
typing_extensions = "==4.15.0"
yarl = "==1.22.0"

[tool.poetry.group.dev.dependencies]
pytest = ">=8,<10"
pytest-asyncio = ">=0.25,<2"

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "strict"
asyncio_default_fixture_loop_scope = "function"
